services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: mental-health-api

    ports:
      - "8001:8001"

    environment:
      OLLAMA_HOST: http://ollama:11434

    depends_on:
      - ollama

    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest

    container_name: mental-health-ollama

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    restart: unless-stopped


volumes:
  ollama_data: